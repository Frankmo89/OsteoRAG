name = "osteorag"
main = "src/index.ts"
compatibility_date = "2025-03-01"
compatibility_flags = ["nodejs_compat"]

# Static assets (UI) + Worker API. Worker primero para /api/*
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

# Secrets: wrangler secret put …  |  local: .dev.vars
# Required: SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, OPENAI_API_KEY
# Optional: OPENAI_BASE_URL, EMBEDDING_DIM, TOP_K, MIN_SIMILARITY, CHAT_OWNER_ID

[vars]
EMBEDDING_MODEL = "text-embedding-3-small"
CHAT_MODEL = "gpt-4o-mini"
